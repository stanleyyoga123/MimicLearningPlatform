[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apprenticeship-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "pypdf==5.9.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "cryptography==46.0.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
